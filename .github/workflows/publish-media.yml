name: publish-media
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Decode videos and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          assemble() {
            local dest="$1"
            if [[ -f "media/${dest}.b64" ]]; then
              base64 -d "media/${dest}.b64" > "out/${dest}"
            elif compgen -G "media/${dest}.b64.*" > /dev/null; then
              cat media/${dest}.b64.* | base64 -d > "out/${dest}"
            else
              echo "missing encoded file for ${dest}" >&2
              exit 1
            fi
          }
          assemble video02-short-1-music.mp4
          assemble video02-short-2-music.mp4
          assemble video02-short-3-music.mp4
          assemble video01-short-3-v2-music.mp4
          assemble meet-dot.mp4
          assemble box-teaser.mp4
          assemble meet-dot-intro.mp4
          assemble meet-dot-intro-v2.mp4
          (cd out && sha256sum -c ../checksums.sha256 --strict)
          if gh release view v1 >/dev/null 2>&1; then
            gh release upload v1 out/* --clobber
          else
            gh release create v1 out/* --title "Hidden Design shorts media" --notes "Public MP4s used to schedule Hidden Design shorts in Buffer."
          fi
      - name: Publish hosted branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          work=/tmp/hosted
          rm -rf "$work"
          if git ls-remote --exit-code --heads origin hosted >/dev/null 2>&1; then
            git clone --branch hosted "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          else
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
            git -C "$work" checkout --orphan hosted
            git -C "$work" rm -rf --ignore-unmatch .
          fi
          rm -rf "$work"/*
          mkdir -p "$work"
          cp out/* "$work"/
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "hosted branch already up to date"
          else
            git -C "$work" commit -m "Publish decoded MP4s for public hosting"
            git -C "$work" push origin hosted
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
